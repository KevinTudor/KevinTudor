
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="700">
      <stop offset="0%" stop-color="#07152A"></stop>
      <stop offset="45%" stop-color="#111B35"></stop>
      <stop offset="100%" stop-color="#060810"></stop>
    </linearGradient>

    <radialGradient id="glowBlue" cx="18%" cy="16%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.34"></stop>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="glowPurple" cx="88%" cy="16%" r="54%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.30"></stop>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="glowOrange" cx="82%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.22"></stop>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"></stop>
    </radialGradient>

    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"></stop>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"></stop>
    </linearGradient>

    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"></stop>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.18"></stop>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"></feGaussianBlur>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.24"></feDropShadow>
    </filter>

    <style>
      .title {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 70px;
        font-weight: 800;
        fill: #F8FAFC;
      }
      .sub {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 25px;
        font-weight: 500;
        fill: #C9D6E7;
      }
      .summary {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 23px;
        font-weight: 500;
        fill: #D6E1EF;
      }
      .cardTitleBlue {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: #4FB8FF;
      }
      .cardTitleCyan {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: #67E8F9;
      }
      .cardTitlePurple {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: #B983FF;
      }
      .cardTitlePink {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: #FF8AD8;
      }
      .cardBody {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 19px;
        font-weight: 500;
        fill: #F3F6FA;
      }
    </style>
  </defs>

  <!-- Full background -->
  <rect width="1200" height="700" rx="30" fill="url(#bg)"></rect>
  <rect width="1200" height="700" rx="30" fill="url(#glowBlue)"></rect>
  <rect width="1200" height="700" rx="30" fill="url(#glowPurple)"></rect>
  <rect width="1200" height="700" rx="30" fill="url(#glowOrange)"></rect>

  <!-- Soft ambient glows -->
  <circle cx="130" cy="100" r="90" fill="#38BDF8" opacity="0.14" filter="url(#softGlow)"></circle>
  <circle cx="1040" cy="90" r="110" fill="#A855F7" opacity="0.16" filter="url(#softGlow)"></circle>
  <circle cx="960" cy="580" r="120" fill="#FB923C" opacity="0.12" filter="url(#softGlow)"></circle>

  <!-- Full glass overlay panel -->
  <rect x="1.5" y="1.5" width="1197" height="697" rx="28.5" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.5"></rect>

  <!-- Header -->
  <text x="70" y="120" class="title">Computer Science</text>
  <text x="70" y="170" class="sub">B.S. in Computer Science  •  Minor in Artificial Intelligence</text>

  <line x1="70" y1="220" x2="790" y2="220" stroke="#63B3ED" stroke-opacity="0.45" stroke-width="3"></line>

  <text x="70" y="285" class="summary">Focused on mobile apps, AI, and full-stack development.</text>

  <!-- Card 1 -->
  <g transform="translate(70, 360)">
    <rect width="250" height="260" rx="26" fill="#0B1730" fill-opacity="0.22" stroke="#59C5FF" stroke-opacity="0.75" stroke-width="1.6" filter="url(#cardShadow)"></rect>
    <text x="125" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#59C5FF">⌨</text>
    <text x="125" y="120" text-anchor="middle" class="cardTitleBlue">Current Project</text>
    <line x1="95" y1="145" x2="155" y2="145" stroke="#59C5FF" stroke-width="3" stroke-linecap="round"></line>
    <text x="125" y="190" text-anchor="middle" class="cardBody">
      <tspan x="125" dy="0">Mobile application using</tspan>
      <tspan x="125" dy="34">JavaScript, React Native,</tspan>
      <tspan x="125" dy="34">and Expo</tspan>
    </text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(350, 360)">
    <rect width="250" height="260" rx="26" fill="#0B1730" fill-opacity="0.22" stroke="#73F0F6" stroke-opacity="0.75" stroke-width="1.6" filter="url(#cardShadow)"></rect>
    <text x="125" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#73F0F6">⌁</text>
    <text x="125" y="120" text-anchor="middle" class="cardTitleCyan">Learning</text>
    <line x1="95" y1="145" x2="155" y2="145" stroke="#73F0F6" stroke-width="3" stroke-linecap="round"></line>
    <text x="125" y="190" text-anchor="middle" class="cardBody">
      <tspan x="125" dy="0">Java, Flutter, and</tspan>
      <tspan x="125" dy="34">Python AI tooling</tspan>
    </text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(630, 360)">
    <rect width="250" height="260" rx="26" fill="#0B1730" fill-opacity="0.22" stroke="#B983FF" stroke-opacity="0.75" stroke-width="1.6" filter="url(#cardShadow)"></rect>
    <text x="125" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#B983FF">◌◌◌</text>
    <text x="125" y="120" text-anchor="middle" class="cardTitlePurple">Collaboration</text>
    <line x1="95" y1="145" x2="155" y2="145" stroke="#B983FF" stroke-width="3" stroke-linecap="round"></line>
    <text x="125" y="190" text-anchor="middle" class="cardBody">
      <tspan x="125" dy="0">Open to AI and</tspan>
      <tspan x="125" dy="34">Full-Stack Development</tspan>
      <tspan x="125" dy="34">projects</tspan>
    </text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(910, 360)">
    <rect width="220" height="260" rx="26" fill="#0B1730" fill-opacity="0.22" stroke="#FF9AD7" stroke-opacity="0.75" stroke-width="1.6" filter="url(#cardShadow)"></rect>
    <text x="110" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" fill="#FF9AD7">⟟</text>
    <text x="110" y="120" text-anchor="middle" class="cardTitlePink">Help Wanted</text>
    <line x1="80" y1="145" x2="140" y2="145" stroke="#FF9AD7" stroke-width="3" stroke-linecap="round"></line>
    <text x="110" y="190" text-anchor="middle" class="cardBody">
      <tspan x="110" dy="0">Locally distributing</tspan>
      <tspan x="110" dy="34">an iOS .ipa file</tspan>
    </text>
  </g>
</svg>
