
<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="900">
      <stop offset="0%" stop-color="#0D1117"></stop>
      <stop offset="45%" stop-color="#111827"></stop>
      <stop offset="100%" stop-color="#0D1117"></stop>
    </linearGradient>

    <radialGradient id="glowBlue" cx="3%" cy="32%" r="42%">
      <stop offset="0%" stop-color="#0366D6" stop-opacity="0.55"></stop>
      <stop offset="38%" stop-color="#0B5ED7" stop-opacity="0.24"></stop>
      <stop offset="100%" stop-color="#0366D6" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="glowPurple" cx="88%" cy="10%" r="54%">
      <stop offset="0%" stop-color="#0D1155" stop-opacity="0.36"></stop>
      <stop offset="42%" stop-color="#0D2192" stop-opacity="0.18"></stop>
      <stop offset="100%" stop-color="#0D1155" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="glowOrange" cx="82%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#3D444D" stop-opacity="0.22"></stop>
      <stop offset="100%" stop-color="#3D444D" stop-opacity="0"></stop>
    </radialGradient>

    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"></stop>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.07"></stop>
    </linearGradient>

    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D444D" stop-opacity="0.95"></stop>
      <stop offset="50%" stop-color="#3D444D" stop-opacity="0.45"></stop>
      <stop offset="100%" stop-color="#3D444D" stop-opacity="0.75"></stop>
    </linearGradient>

    <linearGradient id="innerPanelFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"></stop>
    </linearGradient>

    <linearGradient id="innerPanelStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D444D" stop-opacity="0.60"></stop>
      <stop offset="100%" stop-color="#3D444D" stop-opacity="0.30"></stop>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"></feGaussianBlur>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"></feDropShadow>
    </filter>

    <style>
      .title {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 42px;
        font-weight: 800;
        fill: #F8FAFC;
      }

      .sub {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-weight: 500;
        fill: #C9D6E7;
      }

      .summary {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #D6E1EF;
      }

      .sectionTitle {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 32px;
        font-weight: 800;
        fill: #F8FAFC;
      }

      .sectionSub {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 500;
        fill: #D7E0EC;
      }

      .miniSection {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: #F5F7FB;
      }

      .cardTitleBlue,
      .cardTitleCyan,
      .cardTitlePurple,
      .cardTitlePink {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-weight: 700;
      }

      .cardTitleBlue { fill: #4FB8FF; }
      .cardTitleCyan { fill: #67E8F9; }
      .cardTitlePurple { fill: #B983FF; }
      .cardTitlePink { fill: #FF8AD8; }

      .cardBody {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        fill: #F3F6FA;
      }

      .chipText {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #FFFFFF;
      }

      .chipTextDark {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #111827;
      }
