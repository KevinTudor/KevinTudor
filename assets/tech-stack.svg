
<svg width="1100" height="560" viewBox="0 0 1100 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="560">
      <stop offset="0%" stop-color="#07152A"></stop>
      <stop offset="45%" stop-color="#111B35"></stop>
      <stop offset="100%" stop-color="#060810"></stop>
    </linearGradient>

    <radialGradient id="glowBlue" cx="18%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.34"></stop>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="glowPurple" cx="87%" cy="18%" r="56%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.30"></stop>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="glowOrange" cx="80%" cy="88%" r="52%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.22"></stop>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"></stop>
    </radialGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.24"></feDropShadow>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"></feGaussianBlur>
    </filter>

    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"></stop>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.20"></stop>
    </linearGradient>

    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"></stop>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"></stop>
    </linearGradient>

    <style>
      .title {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 32px;
        font-weight: 800;
        fill: #F8FAFC;
      }
      .subtitle {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 500;
        fill: #D7E0EC;
      }
      .section {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: #F5F7FB;
      }
      .chipText {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .chipTextDark {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #111827;
      }
    </style>
