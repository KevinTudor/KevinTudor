  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="720">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="45%" stop-color="#121A33"/>
      <stop offset="100%" stop-color="#05070F"/>
    </linearGradient>

```
<radialGradient id="glowBlue" cx="20%" cy="20%" r="60%">
  <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
  <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
</radialGradient>

<radialGradient id="glowPurple" cx="85%" cy="15%" r="55%">
  <stop offset="0%" stop-color="#A855F7" stop-opacity="0.45"/>
  <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
</radialGradient>

<radialGradient id="glowOrange" cx="75%" cy="85%" r="60%">
  <stop offset="0%" stop-color="#FB923C" stop-opacity="0.35"/>
  <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
</radialGradient>

<filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
</filter>

<filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="18"/>
</filter>

<linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
  <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.28"/>
</linearGradient>

<linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
  <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.13"/>
</linearGradient>

